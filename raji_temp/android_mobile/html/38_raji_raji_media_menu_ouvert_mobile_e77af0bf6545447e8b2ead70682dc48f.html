<!DOCTYPE html>

        <span class="bg-[#D3A940] text-[#071934] text-xs font-semibold px-3 py-2 rounded-lg">Soumettre</span>
        <div class="w-11 h-11 border border-[#E6E8EB] rounded-lg flex flex-col items-center justify-center space-y-1">
          <span class="w-5 h-0.5 bg-[#071934]"></span>
          <span class="w-5 h-0.5 bg-[#071934]"></span>
          <span class="w-5 h-0.5 bg-[#071934]"></span>
        </div>
      </div>
    </div>
    <!-- Bannière -->
    <div class="bg-[#071934] text-[#FFFFFF] py-6 px-4 border-b border-[#071934]">
      <div class="flex items-center space-x-2 mb-1.5">
        <span class="w-6 h-[3px] bg-[#D3A940] inline-block"></span>
        <span class="text-xs font-semibold uppercase tracking-wider text-[#FFFFFF]">MÉDIA & DIFFUSION</span>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-[#FFFFFF] mb-2">RAJI Média</h1>
      <p class="text-xs text-[#FFFFFF]/80 leading-relaxed">
        L'espace d'inspiration et d'actualités des jeunes innovateurs à travers l'Afrique.
      </p>
    </div>
    <!-- Liste factice d'arrière-plan -->
    <div class="p-4 space-y-4 bg-[#F8F9FA]">
      <div class="h-44 bg-[#E6E8EB] rounded-xl"></div>
      <div class="h-32 bg-[#FFFFFF] border border-[#E6E8EB] rounded-xl"></div>
      <div class="h-32 bg-[#FFFFFF] border border-[#E6E8EB] rounded-xl"></div>
    </div>
  </div>

  <!-- OVERLAY OBSCURCISSEMENT 40% -->
  <div class="absolute inset-0 bg-[#071934]/40 z-40 transition-opacity"></div>

  <!-- SIDE SHEET VOLET LATÉRAL (300px, OUVERT À DROITE) -->
  <aside class="absolute top-0 right-0 bottom-0 w-[300px] bg-[#FFFFFF] z-50 shadow-2xl flex flex-col justify-between border-l border-[#E6E8EB]">
    <!-- HAUT DU VOLET -->
    <div class="p-6">
      <div class="flex items-center justify-between pb-5 border-b border-[#E6E8EB]">
        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDoc6q_4aq0WcAowmH0bL6-NTcTajO3PA7CM31DRRrwTUY28mXcsFe2nXhxVEI_PHfEWGwXGGPmHn3KT7a1rUT51v6owhUq7bZOcjL6OV1MJ9h7OA0gPUf1ykyKGmhWvnVlooz4X4WuzHbG9vf_AaANvHItt6UDPUFFfNTLaJe_T-Y7XhB2gz1LrNyCVBtFUjyO7o0tsPe0XEesQWDa7aIa0yobnfUfCCdJoXnLyyQy_3m4PgcF_kRhCbriIs7nOm9BqAE" alt="Logo RAJI" class="h-10 w-auto object-contain" />

          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />

      <!-- 8 RUBRIQUES OFFICIELLES (RAJI Média ACTIF) -->
      <nav class="flex flex-col space-y-3 pt-6 text-sm font-medium">
        <a href="#" class="text-[#071934] py-1 border-b border-transparent hover:border-[#D3A940]">Accueil</a>
        <a href="#" class="text-[#071934] py-1 border-b border-transparent hover:border-[#D3A940]">À propos</a>
        <a href="#" class="text-[#071934] py-1 border-b border-transparent hover:border-[#D3A940]">Innovateurs</a>
        <a href="#" class="text-[#071934] font-bold py-1 border-b-2 border-[#D3A940] inline-block">RAJI Média</a>
        <a href="#" class="text-[#071934] py-1 border-b border-transparent hover:border-[#D3A940]">Événements</a>
        <a href="#" class="text-[#071934] py-1 border-b border-transparent hover:border-[#D3A940]">Partenaires</a>
        <a href="#" class="text-[#071934] py-1 border-b border-transparent hover:border-[#D3A940]">Opportunités</a>
        <a href="#" class="text-[#071934] py-1 border-b border-transparent hover:border-[#D3A940]">Contact</a>
      </nav>
    </div>

    <!-- BAS DU VOLET -->
    <div class="p-6 border-t border-[#E6E8EB] bg-[#F3F4F5] space-y-4">
      <a href="#" class="w-full block text-center bg-[#D3A940] text-[#071934] text-xs font-bold py-3 rounded-lg hover:opacity-95 transition shadow-sm">
        Soumettre mon innovation
      </a>
      <p class="text-[12px] text-[#071934]/70 text-center">
        © 2026 RAJI. Tous droits réservés.
      </p>
    </div>

</body>
</html>
